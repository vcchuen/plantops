services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # No arm64 image exists for SQL Server 2022; Apple Silicon runs it under amd64 emulation.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set it in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it in .env}
      # KC_HOSTNAME is the issuer URL as seen by the browser (localhost:8081).
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC allows the API container to reach Keycloak via the service name (keycloak:8080)
      # for back-channel operations (token endpoint, JWKS), while tokens still carry iss=http://localhost:8081/...
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/plantops-realm.json:/opt/keycloak/data/import/plantops-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # The PlantOps database does not exist yet on first start: ApplyMigrationsOnStartup lets the Assets
      # module create it and migrate it (EF's Migrate creates a missing database). Azure uses migration bundles instead.
      # TrustServerCertificate=True accepts the container's self-signed cert; acceptable for local compose only.
      ConnectionStrings__PlantOps: "Server=sqlserver,1433;Database=PlantOps;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      Auth__Authority: http://localhost:8081/realms/plantops
      Auth__MetadataAddress: http://keycloak:8080/realms/plantops/.well-known/openid-configuration
      Auth__ClientId: plantops-web
      Auth__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:?set it in .env}
      Auth__RequireHttpsMetadata: "false"
      # Demo data (design 08): a believable Penang plant on an empty database. Off by default everywhere else.
      Seed__Demo: "true"
      # The E2E suite and a demo user click far faster than a person on a production rate limit would (design 08,
      # Decision 3); the shipped defaults are 10 logins/min and 100 API calls/10 s, which these values lift for compose only.
      RateLimiting__Login__PermitLimit: "1000"
      RateLimiting__Login__WindowSeconds: "60"
      RateLimiting__Api__TokenLimit: "10000"
      RateLimiting__Api__TokensPerPeriod: "10000"
      RateLimiting__Api__ReplenishmentSeconds: "10"
      # Service Bus configuration (optional; only set when messaging profile is active).
      # When empty, SLA breach notifications are logged but not published to Service Bus.
      # To enable: set SERVICEBUS_CONNECTION_STRING in .env or run with --profile messaging.
      ServiceBus__ConnectionString: ${SERVICEBUS_CONNECTION_STRING:-}
      ServiceBus__SlaBreachQueue: sla-breaches

  # Service Bus emulator for local SLA breach messaging (docs/design/06, Decision 2).
  # Why optional? The API logs SLA breaches when Service Bus is not configured; the queue decouples
  # escalation detection (API) from notification delivery (Azure Function). Enable with: docker compose --profile messaging up
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    profiles:
      - messaging
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./deploy/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
