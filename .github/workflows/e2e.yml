name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs: a tag can be re-pointed by whoever controls the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create .env from the example (CI-only secrets, never reused)
        run: cp .env.example .env

      # First real run of the compose/Keycloak wiring: build our image, start SQL Server + Keycloak + app,
      # and wait for every healthcheck.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Dump compose diagnostics on startup failure
        if: failure()
        run: |
          mkdir -p compose-logs
          docker compose ps -a | tee compose-logs/ps.txt
          for svc in $(docker compose config --services); do
            echo "::group::logs $svc"
            docker compose logs --no-color --tail=300 "$svc" | tee "compose-logs/$svc.log"
            echo "::endgroup::"
          done
          echo "::group::keycloak realm discovery"
          curl -sS -i http://localhost:8081/realms/plantops/.well-known/openid-configuration | head -40 || true
          echo "::endgroup::"
          echo "::group::api health"
          curl -sS -i http://localhost:8080/health/ready | head -40 || true
          echo "::endgroup::"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Dump compose logs after test failure
        if: failure()
        run: |
          mkdir -p compose-logs
          docker compose ps -a > compose-logs/ps-after-tests.txt || true
          docker compose logs --no-color --tail=300 > compose-logs/all-after-tests.log || true
          docker compose logs --no-color --tail=300 keycloak api || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (traces, screenshots)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs
          path: compose-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
