name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a tag can be re-pointed by whoever controls the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore PlantOps.slnx
      - run: dotnet format PlantOps.slnx --verify-no-changes --no-restore
      - run: dotnet build PlantOps.slnx -c Release --no-restore
      # Integration tests skip locally unless opted in (no DB on dev laptops yet); CI always runs them.
      - run: dotnet test PlantOps.slnx -c Release --no-build
        env:
          PLANTOPS_INTEGRATION_TESTS: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    # Proves the Dockerfile still builds; nothing is pushed until the deploy milestone.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t plantops:ci .
