name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a tag can be re-pointed by whoever controls the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore PlantOps.slnx
      # Supply chain (OWASP A03:2025): fail on any known-vulnerable NuGet package, direct or transitive.
      # `dotnet list package` exits 0 even when it finds some, so the output is what gets checked.
      - name: Fail on vulnerable NuGet packages
        shell: bash
        run: |
          dotnet list PlantOps.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above). Upgrade them in Directory.Packages.props."
            exit 1
          fi
      - run: dotnet format PlantOps.slnx --verify-no-changes --no-restore
      - run: dotnet build PlantOps.slnx -c Release --no-restore
      # Integration tests skip locally unless opted in (no DB on dev laptops yet); CI always runs them.
      - run: dotnet test PlantOps.slnx -c Release --no-build
        env:
          PLANTOPS_INTEGRATION_TESTS: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Production dependencies only: dev tooling advisories do not ship to users, but a high one in what we serve does.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Run the suite on both sides of UTC. Date bugs are directional: parsing "2026-10-20" as UTC midnight shows
      # the previous day west of UTC, while formatting a local date in UTC shows the previous day east of it
      # (the factory is UTC+8). A UTC CI runner sees neither.
      - run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm test
        env:
          TZ: Asia/Kuala_Lumpur
      - run: npm run build

  container:
    # Proves the Dockerfile still builds; nothing is pushed until the deploy milestone.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t plantops:ci .
