<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); main.focus()">
  Skip to main content
</a>

<header>
  <mat-toolbar color="primary">
    @if (isHandset()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Toggle navigation"
        (click)="drawer.toggle()"
      >
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    }
    <span>PlantOps</span>
    <span class="spacer"></span>
    @if (session.isAuthenticated()) {
      <span class="user">{{ session.displayName() }} · {{ session.roles().join(', ') }}</span>
      <button mat-button type="button" (click)="session.logout()">Sign out</button>
    } @else if (session.status() === 'anonymous') {
      <button mat-button type="button" (click)="signIn()">Sign in</button>
    }
  </mat-toolbar>
</header>

<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
    fixedTopGap="56"
  >
    <nav aria-label="Primary">
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/status"
          routerLinkActive
          #status="routerLinkActive"
          ariaCurrentWhenActive="page"
          [activated]="status.isActive"
          (click)="isHandset() && drawer.close()"
        >
          System status
        </a>
        <a
          mat-list-item
          routerLink="/assets"
          routerLinkActive
          #assets="routerLinkActive"
          ariaCurrentWhenActive="page"
          [activated]="assets.isActive"
          (click)="isHandset() && drawer.close()"
        >
          Assets
        </a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main-content" #main tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
